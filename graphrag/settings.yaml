### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## There are a number of settings to tune the threading and token limits for LLM calls - check the docs.

models:
  default_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key # or azure_managed_identity
    api_key: ${GRAPHRAG_API_KEY} # set this in the generated .env file, or remove if managed identity
    model: Qwen/Qwen2.5-7B-Instruct
    api_base: http://127.0.0.1:8000/v1
    model_supports_json: true
    # without a limit the model can generate until the window is full, and the gleaning round sends this overlong output back
    # together with the original prompt and overflows; temperature 0 makes this deterministic, and 10 retries cannot save it.
    #
    # But 2048 is too small: community reports target max_length=2000 words, and large communities (level 0 averages 304
    # entities) get reports truncated into incomplete JSON; after the parse failure GraphRAG logs "No report found"
    # and drops them -- measured: 868 of 8,550 communities lost, 68% of level 0.
    # So community reports use report_chat_model below (4096) while extraction stays at 2048 --
    # GraphRAG's cache key includes model parameters, and changing it would invalidate the whole existing extraction cache.
    max_tokens: 2048
    concurrent_requests: 16
    async_mode: threaded # or asyncio
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null
  report_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: Qwen/Qwen2.5-7B-Instruct
    api_base: http://127.0.0.1:8000/v1
    model_supports_json: true
    # Reports use guided decoding to enforce JSON, but guided decoding only guarantees the syntactic shape:
    # once max_tokens truncates the output, the JSON is incomplete, fails to parse, and is
    # silently dropped as "No report found". The largest level-0 community has 1,615 entities; with
    # max_input_length=8000 its prompt reaches 9,935 tokens and the output is cut at 4096
    # (finish_reason=length); measured: 812 of 8,550 communities lost, 65% of level 0.
    # 8192 with the halved max_input_length below: prompt about 5,935 + output = 14k, still within
    # max-model-len 16384; the three largest communities measured only 671-909 output tokens, ample headroom.
    max_tokens: 8192
    # four-GPU data parallelism behind a proxy needs high concurrency to saturate; with 16 each GPU gets only 4 streams and batching is inefficient.
    concurrent_requests: 64
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null
  default_embedding_model:
    type: embedding
    model_provider: openai
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: BAAI/bge-small-en-v1.5
    api_base: http://127.0.0.1:8011/v1
    concurrent_requests: 25
    async_mode: threaded # or asyncio
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null

### Input settings ###

input:
  storage:
    type: file # or blob
    base_dir: "input"
  file_type: text # [csv, text, json]

chunks:
  size: 1200
  overlap: 100
  group_by_columns: [id]

### Output/storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

output:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"
    
cache:
  type: file # [file, blob, cosmosdb]
  base_dir: "cache"

reporting:
  type: file # [file, blob]
  base_dir: "logs"

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: output/lancedb
    container_name: default

### Workflow settings ###

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store

extract_graph:
  model_id: default_chat_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [organization,person,geo,event]
  max_gleanings: 1

summarize_descriptions:
  model_id: default_chat_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]
  async_mode: threaded # or asyncio

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  model_id: default_chat_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  model_id: report_chat_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  # 8000 puts the prompts of large communities near 10k tokens, pushing the output to the window edge and triggering truncation.
  # with it halved, model outputs are actually shorter and more stable (measured 671-909 tokens vs 4096 at the cap before).
  max_input_length: 4000

embed_graph:
  enabled: false # if true, will generate node2vec embeddings for nodes

umap:
  enabled: false # if true, will generate UMAP embeddings for nodes (embed_graph must also be enabled)

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  chat_model_id: default_chat_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"

basic_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
